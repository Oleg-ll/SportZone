<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мій профіль | SportZone</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="header">
    <div class="wrapper header-inner">
      <a class="logo" href="index.html">SportZone</a>
      <nav>
        <a href="user.html" class="button button-blue-outline">Мій профіль</a>
        <a href="#" class="button button-blue-outline">Мої замовлення</a>
        <button id="logoutBtn" class="button button-dark-outline">Вийти</button>
</nav>
    </div>
  </header>

  <section class="user-dashboard">
    <div class="wrapper">
      <h2>Вітаємо, <span class="highlight" id="userName">Користувач</span>!</h2>
      <p>Це ваша персональна сторінка користувача.</p>

      <div class="user-info-box">
        <h3>Ваш профіль</h3>
        <p><b>Email:</b> <span id="userEmail">Завантаження...</span></p>
        
        <p><b>Кількість замовлень:</b> 0</p> 
        <p><b>Останнє замовлення:</b> -</p>
      </div>
    </div>
</section>

<script src="../js/user.js"></script>
  <script src="../js/user.js"></script>
</body>
</html>
