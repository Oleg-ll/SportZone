<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін панель | SportZone</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <header class="header">
        <div class="header-inner wrapper">
            <a class="logo" href="index.html">SportZone <span style="font-size: 14px; color: #666;">(Admin)</span></a>
            <div class="header-actions">
                <a href="index.html" class="button button-blue-outline">На сайт</a>
                <button id="logoutBtn" class="button button-dark-outline">Вийти</button>
            </div>
        </div>
    </header>

    <div class="admin-container">
        <h1>Панель керування товарами</h1>

        <h2>Додати новий товар</h2>
        <form id="productForm" class="admin-form">
            <input type="text" id="ProductName" placeholder="Назва товару" required>
            <input type="number" id="Price" placeholder="Ціна (грн)" required>
            <input type="number" id="Stock" placeholder="Кількість на складі" required>
            <input type="number" id="CategoryID" placeholder="ID категорії" required>
            
            <input type="text" id="ImageURL" placeholder="URL картинки (https://...)" style="grid-column: span 2;">
            <textarea id="Description" placeholder="Опис товару" rows="3" style="grid-column: span 2;"></textarea>

            <button type="submit" class="button button-blue" style="grid-column: span 2;">Додати товар</button>
        </form>

        <h2>Список товарів</h2>
        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Фото</th>
                <th>Назва</th>
                <th>Ціна</th>
                <th>Склад</th>
                <th>Кат.</th>
                <th>Дії</th>
            </tr>
            </thead>
            <tbody id="productTable">
                </tbody>
        </table>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">✖</span>
            <h3>Редагувати товар</h3>

            <input type="hidden" id="editID">
            <input type="text" id="editName" placeholder="Назва">
            <input type="number" id="editPrice" placeholder="Ціна">
            <input type="number" id="editStock" placeholder="Кількість">
            <input type="number" id="editCategory" placeholder="ID категорії">
            <input type="text" id="editImage" placeholder="URL картинки">
            <textarea id="editDescription" placeholder="Опис" rows="3"></textarea>

            <button class="button button-blue" onclick="saveEdit()" style="width: 100%;">Зберегти зміни</button>
        </div>
    </div>

    <script src="../js/admin.js"></script>

</body>
</html>
