<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація – SportZone</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner wrapper">
      <a class="logo" href="index.html">SportZone</a>
      <div class="header-actions">
        <a href="login.html" class="button button-dark-outline">Увійти</a>
      </div>
    </div>
  </header>

  <section class="login-section">
    <h2>Створити акаунт</h2>

    <form id="registerForm" class="login-form">
      <input type="text" id="username" placeholder="Ім’я користувача" required>
      <input type="email" id="email" placeholder="Електронна пошта" required>
      <input type="password" id="password" placeholder="Пароль" required>
      <input type="password" id="password2" placeholder="Підтвердіть пароль" required>

      <button type="submit" class="button button-blue">Зареєструватися</button>

      <p class="note">Вже маєте акаунт? <a href="login.html">Увійдіть тут</a></p>
    </form>

    <p id="registerMessage"></p>
  </section>

  <footer class="footer">
    <div class="wrapper">
      <p>&copy; 2025 SportZone. Всі права захищені.</p>
    </div>
  </footer>

  <script src="../js/registration.js"></script>
</body>
</html>
